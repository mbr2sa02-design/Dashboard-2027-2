<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Setup check</title>
<body style="font:16px system-ui;max-width:560px;margin:20px auto;padding:0 16px"><h2>Setup check</h2><div id="o"></div>
<script src="supabase.js"></script><script src="config.js"></script>
<script>
const o=document.getElementById('o');const L=(ok,t)=>o.insertAdjacentHTML('beforeend',`<p>${ok?'✅':'❌'} ${t}</p>`);
(async()=>{
L(!!window.supabase,'supabase.js loaded'+(window.supabase?'':' — file supabase.js missing or not uploaded'));
const u=window.SUPABASE_URL,k=window.SUPABASE_ANON_KEY;
L(/^https:\/\/[a-z0-9]+\.supabase\.co$/.test(u||''),'config.js URL: '+(u||'(missing)'));
L(/^eyJ|^sb_publishable_/.test(k||''),'config.js key present');
if(!window.supabase||!u||!k)return;
const c=window.supabase.createClient(u,k);
const r=await c.from('records').select('k',{count:'exact',head:true});
L(!r.error||r.error.code==='42501'||r.status===401||r.status===200,'Connected to Supabase'+(r.error?' ('+r.error.message+')':''));
if(r.error&&r.error.code==='42P01')L(false,'Tables missing — run setup.sql');
const s=await c.auth.getSession();L(true,'Signed in: '+(s.data.session?s.data.session.user.email:'no (normal here)'));
})();
</script></body>
